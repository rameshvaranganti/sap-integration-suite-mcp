name: Bug report
description: Report a reproducible issue without customer data or credentials.
body:
  - type: markdown
    attributes:
      value: Never include tokens, secrets, business payloads, employee data or unredacted SAP logs. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples and include expected and observed behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Server and Node.js versions
    validations:
      required: true
